<div class="filter-card">
    <div class="filter-grid">
        <div class="filter-group">
            <label>Search Dataset</label>
            <input type="text" class="filter-input" data-filter="search" placeholder="ID, product, region...">
        </div>
        <div class="filter-group">
            <label>Region</label>
            <select class="filter-input" data-filter="region"><option value="All">All Regions</option></select>
        </div>
        <div class="filter-group">
            <label>Product</label>
            <select class="filter-input" data-filter="product"><option value="All">All Products</option></select>
        </div>
        <div class="filter-group">
            <label>Start Date</label>
            <input type="date" class="filter-input" data-filter="date_from">
        </div>
        <div class="filter-group">
            <label>End Date</label>
            <input type="date" class="filter-input" data-filter="date_to">
        </div>
        <div class="filter-meta">
            <span><span class="filter-record-count">0</span> / <span class="filter-total-count">0</span></span>
            <button class="link-btn filter-reset"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
        </div>
    </div>
</div>
